<!doctype html>
<html lang="de">
  <head>

    <meta name="theme-color" content="#161a17" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Crack</title>
    <!-- Absichtlich ohne PNG-Icon: Chrome soll hier eine Verknuepfung im App-Modus anlegen, wie bei der App Training. -->
    <link rel="manifest" href="android.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Vom Startbildschirm aus direkt weiter zu Crack, im normalen Browser-Tab die Anleitung zeigen.
      if (new URLSearchParams(location.search).has('start') || matchMedia('(display-mode: standalone)').matches) {
        location.replace('./')
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 32px 24px;
        background: #161a17;
        color: #e9eee9;

      }

        margin: 0 0 8px;
        font-size: 24px;
      }
      li {
        margin-bottom: 8px;
      }
      a {
        color: #96bb9f;
      }
    </style>
  </head>
  <body>
    <h1>Crack auf den Startbildschirm</h1>
    <ol>
      <li>Tippe in Chrome oben rechts auf <strong>⋮</strong>.</li>
      <li>Wähle <strong>Zum Startbildschirm hinzufügen</strong>.</li>
      <li>Bestätige und öffne Crack danach über das neue Symbol.</li>
    </ol>
    <p><a href="./">Crack hier im Browser öffnen</a></p>
